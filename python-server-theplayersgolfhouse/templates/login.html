<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — AI Blog Generator</title>
  <script>
    window.APP_ROOT = {{ app_root(request) | tojson }};
    window.appPath = function(path) {
      const root = window.APP_ROOT || "";
      if (!path) return root || "/";
      if (/^(?:[a-z]+:)?\/\//i.test(path) || path.startsWith('data:') || path.startsWith('mailto:') || path.startsWith('tel:') || path.startsWith('#')) return path;
      if (root && (path === root || path.startsWith(root + '/'))) return path;
      if (path.startsWith('/')) return root ? root + path : path;
      return path;
    };
    (function() {
      const nativeFetch = window.fetch.bind(window);
      window.fetch = function(input, init) {
        if (typeof input === 'string') input = window.appPath(input);
        return nativeFetch(input, init);
      };
    })();
    window.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('a[href]').forEach(function(el) {
        const href = el.getAttribute('href') || '';
        if (href.startsWith('/')) el.setAttribute('href', window.appPath(href));
      });
      document.querySelectorAll('form[action]').forEach(function(el) {
        const action = el.getAttribute('action') || '';
        if (action.startsWith('/')) el.setAttribute('action', window.appPath(action));
      });
    });
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #f1f5f9;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #1e293b; border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      padding: 48px 48px 40px; width: 100%; max-width: 420px;
    }
    .logo {
      font-size: 18px; font-weight: 800; color: #f1f5f9;
      letter-spacing: -0.5px; margin-bottom: 6px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #f1f5f9; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 32px; }

    .alert {
      border-radius: 8px; padding: 11px 14px; font-size: 13px;
      margin-bottom: 20px; border: 1px solid;
    }
    .alert-error { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.35); color: #fca5a5; }
    .alert-info  { background: rgba(59,130,246,0.12); border-color: rgba(59,130,246,0.35); color: #93c5fd; }

    .field { margin-bottom: 20px; }
    label {
      display: block; font-size: 12px; font-weight: 600; color: #94a3b8;
      margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    select, input[type="password"] {
      width: 100%; padding: 10px 13px; border: 1px solid #334155;
      border-radius: 8px; font-size: 15px; color: #f1f5f9;
      background: #0f172a; outline: none; transition: border-color 0.15s;
    }
    input[type="password"] { font-family: monospace; letter-spacing: 0.05em; }
    select:focus, input[type="password"]:focus {
      border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }

    .btn {
      width: 100%; padding: 11px; border-radius: 8px; font-size: 14px;
      font-weight: 700; cursor: pointer; border: none;
      background: #3b82f6; color: #fff; transition: background 0.15s;
    }
    .btn:hover { background: #2563eb; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">AI Blog Generator</div>
  <h1>Sign In</h1>
  <div class="subtitle">Select your store (or Admin) and enter your password.</div>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  {% if not has_admin_password and not error %}
  <div class="alert alert-info">First time? Enter a password to set it for the selected account.</div>
  {% endif %}

  <form method="POST" action="/login">
    <input type="hidden" name="next" value="{{ next }}" />
    <div class="field">
      <label>Account</label>
      <select name="store_id" required>
        <option value="__admin__">&#x2699; Admin</option>
        {% for store in stores %}
        <option value="{{ store.id }}">{{ store.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" autofocus autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>
</div>
</body>
</html>
