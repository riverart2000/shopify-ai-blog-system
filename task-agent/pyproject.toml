[project]
name = "task-agent"
version = "0.1.0"
description = "Background agents that do web, email and promotion tasks, one job at a time"
authors = [
    { name = "Joe Bains", email = "riverart2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.15.0",
    "certifi>=2026.10.23",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "playwright>=1.64.1",
    "pydantic-ai-slim[duckduckgo,openai]>=2.63.0",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
    "truststore>=0.10.5",
    "uvicorn>=0.30",
]

[project.scripts]
task-agent = "task_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: needs the local oMLX model server (skipped by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
