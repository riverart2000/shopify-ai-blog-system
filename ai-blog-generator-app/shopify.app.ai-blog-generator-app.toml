# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a3d6eb8bb803ee6904df466e816935d9"
application_url = "https://revenuemindproai.com"
embedded = true
name = "BioluxeLab AI Blog Studio"
description = "Generate, review, and publish AI-assisted Shopify blog articles from an embedded app."

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_content,write_content,read_files,write_files"

[webhooks]
api_version = "2026-07"

	[[webhooks.subscriptions]]
	uri = "/webhooks/app/uninstalled"
	topics = [ "app/uninstalled" ]

	[[webhooks.subscriptions]]
	uri = "/webhooks/app/scopes_update"
	topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://revenuemindproai.com/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
